# fly.toml app configuration file generated for etsy-upload-tool-backend on 2026-09-21T17:54:19-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'etsy-upload-tool-backend'
primary_region = 'iad'

[build]
[env]
  PORT = '3020'

[http_service]
  internal_port = 3020
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
