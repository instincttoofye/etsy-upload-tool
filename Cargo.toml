[package]
name = "etsy-upload-tool-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
